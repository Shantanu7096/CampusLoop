  <rect x="310" y="520" width="815" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="330" y="557" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Replaced faulty SFP+ module and tested fiber signal strength (-3dBm optimal)...</text>
