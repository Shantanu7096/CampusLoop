  <text x="70" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#a7f3d0">Technician: Marcus Vance • Dept: Electrical</text>
  
  <rect x="940" y="130" width="80" height="60" rx="10" fill="#022c22"/>
  <text x="965" y="152" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#a7f3d0">ACTIVE</text>
