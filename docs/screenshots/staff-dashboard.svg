  <rect x="40" y="230" width="1120" height="400" rx="16" fill="url(#cardStaff)" stroke="#e2e8f0" stroke-width="2"/>

  <rect x="70" y="260" width="90" height="28" rx="6" fill="#d1fae5"/>
  <text x="88" y="279" font-family="monospace" font-weight="800" font-size="14" fill="#047857">FF-1004</text>

  <rect x="170" y="260" width="90" height="28" rx="14" fill="#fef3c7"/>
  <text x="195" y="279" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#d97706">HIGH</text>

  <rect x="270" y="260" width="90" height="28" rx="6" fill="#f1f5f9"/>
