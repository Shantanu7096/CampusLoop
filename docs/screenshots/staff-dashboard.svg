  <text x="1052" y="152" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#a7f3d0">NEW QUEUE</text>
  <text x="1070" y="177" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#fcd34d">2</text>

